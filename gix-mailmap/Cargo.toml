lints.workspace = true

[package]
name = "gix-mailmap"

repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project for parsing mailmap files"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2021"
rust-workspace=true
include = ["src/**/*", "LICENSE-*"]

[lib]
doctest = false

[features]
## Data structures implement `serde::Serialize` and `serde::Deserialize`.
serde = ["dep:serde", "bstr/serde", "gix-actor/serde"]

[dependencies]
gix-actor = { workspace=true }
gix-date = { workspace=true }
bstr = { workspace=true, features = ["std", "unicode"] }
thiserror = "2.0.17"
serde = { workspace=true, optional = true, features = ["derive"] }

document-features = { workspace=true, optional = true }

[dev-dependencies]
gix-testtools = { workspace=true }

[package.metadata.docs.rs]
all-features = true
features = ["document-features"]
