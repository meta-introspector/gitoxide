lints.workspace = true

[package]
name = "gix-ignore"

repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project dealing .gitignore files"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2021"
include = ["src/**/*", "LICENSE-*"]
rust-workspace=true

[lib]
doctest = false

[features]
## Data structures implement `serde::Serialize` and `serde::Deserialize`.
serde = ["dep:serde", "bstr/serde", "gix-glob/serde"]

[dependencies]
gix-glob = { workspace=true }
gix-path = { workspace=true }
gix-trace = { workspace=true }

bstr = { workspace=true, features = ["std", "unicode"] }
unicode-bom = { workspace=true }
serde = { workspace=true, optional = true, features = ["derive"] }

document-features = { workspace=true, optional = true }

[dev-dependencies]
gix-testtools = { workspace=true }
gix-fs = {  workspace=true}

[package.metadata.docs.rs]
all-features = true
features = ["document-features"]
