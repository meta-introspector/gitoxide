lints.workspace = true

[package]
name = "gix-revwalk"

repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate providing utilities for walking the revision graph"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2021"
include = ["src/**/*", "LICENSE-*"]
rust-workspace=true

[lib]
doctest = false

[dependencies]
gix-hash = { workspace=true }
gix-object = { workspace=true }
gix-date = { workspace=true }
gix-hashtable = { workspace=true }
gix-commitgraph = { workspace=true }

thiserror = "2.0.17"
smallvec = { workspace = true }

[dev-dependencies]
gix-testtools = { workspace=true }
