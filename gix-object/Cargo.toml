lints.workspace = true

[package]
name = "gix-object"
#workspace=true
description = "Immutable and mutable git objects with decoding and encoding support"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
edition = "2021"
include = ["src/**/*", "LICENSE-*"]
rust-workspace=true

[lib]
doctest = false

#[[bench]]
#name = "decode-objects"
#harness = false


#[[bench]]
#name = "edit-tree"
#harness = false



[features]
## Data structures implement `serde::Serialize` and `serde::Deserialize`.
serde = [
    "dep:serde",
    "bstr/serde",
    "smallvec/serde",
    "gix-hash/serde",
    "gix-actor/serde",
]
## When parsing objects by default errors will only be available on the granularity of success or failure, and with the above flag enabled
## details information about the error location will be collected.
## Use it in applications which expect broken or invalid objects or for debugging purposes. Incorrectly formatted objects aren't at all
## common otherwise.
verbose-object-parsing-errors = ["winnow/std"]

[dependencies]
gix-features = { workspace=true, features = [
    "progress",
] }
gix-hash = { workspace=true }
gix-hashtable = { workspace=true }
gix-validate = { workspace=true }
gix-actor = { workspace=true }
gix-date = { workspace=true }
gix-path = { workspace=true }
gix-utils = { workspace=true }

itoa = "1.0.1"
thiserror = "2.0.17"
bstr = { workspace=true, features = [
    "std",
    "unicode",
] }
winnow = { workspace=true, features = ["simd"] }
smallvec = { workspace=true } # , features = ["write"] }
serde = { workspace=true, optional = true, features = [
    "derive",
] }

document-features = { workspace=true, optional = true }

[dev-dependencies]
criterion = "0.7.0"
pretty_assertions = "1.0.0"
gix-testtools = {  workspace=true}
gix-odb = { workspace=true }
termtree = "0.5.1"

[package.metadata.docs.rs]
all-features = true
features = ["document-features"]
