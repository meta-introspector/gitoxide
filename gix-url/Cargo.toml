lints.workspace = true

[package]
name = "gix-url"

repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project implementing parsing and serialization of gix-url"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2021"
include = ["src/**/*", "LICENSE-*", "tests/baseline/**/*"]
rust-workspace=true

[lib]
doctest = false

[features]
## Data structures implement `serde::Serialize` and `serde::Deserialize`.
serde = ["dep:serde", "bstr/serde"]

[dependencies]
gix-features = { workspace=true }
gix-path = { workspace=true }

serde = { workspace=true, optional = true, features = ["std", "derive"] }
thiserror = "2.0.17"
bstr = { workspace=true, features = ["std"] }
percent-encoding = "2.3.1"

document-features = { workspace=true, optional = true }

[dev-dependencies]
assert_matches = "1.5.0"
gix-testtools = { workspace=true }

[package.metadata.docs.rs]
all-features = true
features = ["document-features"]
