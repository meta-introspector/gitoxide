lints.workspace = true

[package]
name = "gix-discover"
#workspace=true
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "Discover git repositories and check if a directory is a git repository"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2021"
include = ["src/**/*", "LICENSE-*"]
rust-workspace=true

[lib]
doctest = false

[dependencies]
gix-sec = { workspace=true }
gix-path = { workspace=true }
gix-ref = { workspace=true }
gix-hash = { workspace=true }
gix-fs = { workspace=true }

bstr = { workspace=true, features = ["std", "unicode"] }
thiserror = "2.0.17"

[target.'cfg(windows)'.dependencies]
dunce = "1.0.3"

[dev-dependencies]
gix-testtools = { workspace=true }
serial_test = { workspace=true }
is_ci = "1.1.1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
defer = "0.2.1"

[target.'cfg(any(unix, windows))'.dev-dependencies]
tempfile = "3.23.0"
